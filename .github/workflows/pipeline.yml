
name: Tourism Project Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ===================================
  # JOB 1: REGISTER DATASET
  # ===================================

  register-dataset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tourism_project/requirements.txt

      - name: Register Dataset
        run: |
          python tourism_project/model_building/data_register.py

      - name: Verify Dataset
        run: |
          test -f tourism_project/data/tourism.csv
          echo "Dataset file verified successfully"

      - name: Upload Registered Dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data/tourism.csv
          if-no-files-found: error

  # ===================================
  # JOB 2: DATA PREPARATION
  # ===================================

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tourism_project/requirements.txt

      - name: Download Registered Dataset
        uses: actions/download-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data

      - name: Run Data Preparation
        run: |
          python tourism_project/model_building/prep.py

      - name: Verify Data Splits
        run: |
          test -f Xtrain.csv
          test -f Xtest.csv
          test -f ytrain.csv
          test -f ytest.csv
          echo "All training and testing files verified"

      - name: Upload Train Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            Xtrain.csv
            Xtest.csv
            ytrain.csv
            ytest.csv
          if-no-files-found: error

   
      - name: Upload Train and Test Datasets to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ola-williams/tourism-package-prediction
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])

          for filename in [
              "Xtrain.csv",
              "Xtest.csv",
              "ytrain.csv",
              "ytest.csv"
          ]:
              api.upload_file(
                  path_or_fileobj=filename,
                  path_in_repo=filename,
                  repo_id=os.environ["HF_REPO_ID"],
                  repo_type="dataset"
              )
              print(f"Uploaded: {filename}")
          PY

  # ===================================
  # JOB 3: MODEL TRAINING
  # ===================================

  model-training:
    needs: data-prep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tourism_project/requirements.txt
          python -m pip show mlflow

      - name: Download Train Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: .

      - name: Verify Downloaded Data
        run: |
          test -f Xtrain.csv
          test -f Xtest.csv
          test -f ytrain.csv
          test -f ytest.csv
          echo "Training data downloaded successfully"

      - name: Train XGBoost Model
        env:
          MLFLOW_TRACKING_URI: file:./mlruns
        run: |
          python tourism_project/model_building/train.py

      - name: Verify Trained Model
        run: |
          test -f tourism_project/deployment/best_model.pkl
          echo "Trained model verified successfully"

      - name: Upload Trained Model
        uses: actions/upload-artifact@v4
        with:
          name: trained-tourism-model
          path: tourism_project/deployment/best_model.pkl
          if-no-files-found: error

      - name: Upload MLflow Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-run-logs
          path: mlruns/
          if-no-files-found: ignore

      - name: Commit Trained Model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -f tourism_project/deployment/best_model.pkl

          if ! git diff --cached --quiet; then
            git commit -m "Add trained model [skip ci]"
            git push origin HEAD:main
          else
            echo "No model changes to commit"
          fi
